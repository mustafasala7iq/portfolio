<style>
.hero{background:var(--yellow);color:var(--black)}
.hero .inner{padding-block:26px 30px}
.hero h1{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:900}

main .inner{padding-block:22px 60px}
section+section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}

/* login */
.login{max-width:440px;margin:40px auto 0}
.login h1{font-size:1.6rem;font-weight:900}

.steps li.ok{color:var(--muted)}

.steps li.wait .ic{border-color:var(--gold);background:var(--yellow-soft)}
.t-go{margin-top:6px;min-height:52px;font-size:1.05rem}

.pre{margin-bottom:12px;background:var(--yellow-wash);border-color:#F2DE92}
.pre-ok{text-align:center;align-items:center;line-height:1.7}.pre-ok-ic{font-size:2.4rem;line-height:1}.pre-ok-t{font-family:var(--font-display);font-size:1.35rem}.pre-ok-go{font-weight:700}
.mtn-svg{direction:ltr;display:block;width:100%;height:auto;border-radius:22px;border:2px solid var(--black);box-shadow:0 5px 0 var(--black);font-family:var(--font-body);background:#fff}

.prog{position:relative;height:8px;border-radius:99px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:14px;max-width:420px}
.prog i{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--black);border-radius:99px;transition:width .6s}
#paidView,#freeView{display:flex;flex-direction:column;gap:22px}
#paidView[hidden],#freeView[hidden]{display:none}
.today .t-title{margin-top:2px}
.t-hint{text-align:center;color:var(--muted);font-weight:600;margin-top:2px}
.t-miss{text-align:center;font-weight:700;color:var(--red);font-size:.92rem}
.t-v{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.t-v b{font-family:var(--font-display)}
.rows{padding:0;overflow:hidden}
.drow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}

.dn{flex:none;width:34px;height:34px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font:900 .95rem/1 var(--font-display)}
.dt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt b{font:700 .97rem/1.4 var(--font-display)}
.dt b.en{direction:ltr;unicode-bidi:isolate}
.st{flex:none;font:800 .78rem/1 var(--font-display);padding:5px 9px 7px;border-radius:99px}
.st.ok{background:var(--green-soft);color:var(--green)} .st.wait{background:var(--yellow-soft);color:var(--gold)} .st.bad{background:var(--red-soft);color:var(--red)}
.chev{flex:none;color:var(--muted);font-size:1.3rem;line-height:1}
.row-more{all:unset;box-sizing:border-box;cursor:pointer;width:100%;text-align:center;padding:13px;font:800 .9rem/1 var(--font-display);color:var(--ink-2)}
.wide{width:100%}
.start-vids{padding:16px;display:grid;gap:16px}
@media (min-width:640px){.start-vids{grid-template-columns:1fr 1fr}}
.start-vids .t-v{margin:0}
.fsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.fstep{display:flex;gap:14px;padding:18px;align-items:flex-start}
.fn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--black);color:var(--yellow);display:grid;place-items:center;font:900 1rem/1 var(--font-display)}
.fb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.fb-body h3{font-size:1.15rem;font-weight:900}
.fb-body p{margin:0}
.fstep .pre{margin:0;background:none;border:0;box-shadow:none;padding:0}
.pre-done{padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--yellow-wash);border-color:#F2DE92;line-height:1.8}
.pre-done p{margin:0}
.pre-done .pre-ok-t{font:900 1.2rem/1.4 var(--font-display)}
.pre-done .pre-ok-go{font-weight:700}
.actd{padding:14px 18px}
.actd summary{cursor:pointer;font:800 .95rem/1.4 var(--font-display);list-style:none}
.actd summary::-webkit-details-marker{display:none}
.actd form{margin-top:10px}
.lesson-body{flex:1;overflow:auto;padding-block:18px 40px}
.lesson-body .stack{gap:10px}
.lesson-body b{font-family:var(--font-display)}
.lesson{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column}
.lesson-bar{flex:none;display:flex;align-items:center;gap:12px;background:var(--black);color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));box-shadow:0 2px 0 var(--yellow)}
.lesson-bar b{font:800 .95rem/1.3 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lesson iframe{flex:1;width:100%;border:0;background:var(--paper)}

<body>
<header class="bar"><div class="inner">
  <div class="lock" id="lock"></div>
  <div class="sp"></div>
  <span class="chip" id="dayChip" hidden>اليوم <b id="dayNum">1</b>/<span id="dayTot">30</span></span>
  <button class="chip" id="logout" hidden>خروج</button>
</div></header>

<div id="vLogin">
  <div class="inner">
    <form class="login card pad stack" id="loginForm" novalidate>
      <div>
        <h1 id="loginTitle">كورس مصطفى صلاح</h1>
        <p class="sub muted" id="loginSub">ما راح تحفظ، راح تحجي.</p>
      </div>
      <div class="field" data-m="act free"><label for="name">اسمك</label>
        <input class="input" id="name" autocomplete="name" placeholder="مثلاً: علي حسن"></div>
      <div class="field" data-m="act free"><label for="phone">رقم الموبايل</label>
        <input class="input en" id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="07xx xxx xxxx" maxlength="16"></div>
      <div class="field" data-m="login act free forgot"><label for="email" id="emailLabel">الإيميل</label>
        <input class="input en" id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="name@gmail.com"></div>
      <div class="field" data-m="login act free reset"><label for="pw">الباسورد</label>
        <input class="input en" id="pw" type="password" autocomplete="current-password" placeholder="6 أحرف أو أكثر"></div>
      <div class="field" data-m="act free reset"><label for="pw2">أكد الباسورد</label>
        <input class="input en" id="pw2" type="password" autocomplete="new-password" placeholder="اكتبه مرة ثانية"></div>
      <div class="field" data-m="act"><label for="code">كود التفعيل</label>
        <input class="input en" id="code" autocapitalize="characters" autocomplete="one-time-code" placeholder="TA-XXXXX"></div>
      <div class="field" data-m="free"><label for="goal">ليش تتعلم إنكليزي؟</label>
        <select class="input" id="goal"><option value="">اختار</option><option>للشغل</option><option>للدراسة</option><option>للسفر</option><option>أريد أحچي بثقة</option><option>غيرها</option></select></div>
      <div class="field" data-m="free"><label for="city">المحافظة</label>
        <select class="input" id="city"><option value="">اختار محافظتك</option><option>البصرة</option><option>بغداد</option><option>أربيل</option><option>الأنبار</option><option>بابل</option><option>حلبجة</option><option>دهوك</option><option>ديالى</option><option>ذي قار</option><option>السليمانية</option><option>صلاح الدين</option><option>القادسية</option><option>كربلاء</option><option>كركوك</option><option>المثنى</option><option>ميسان</option><option>النجف</option><option>نينوى</option><option>واسط</option><option>خارج العراق</option></select></div>
      <div class="field" data-m="pre"><label for="pay">شلون تحب تدفع؟</label>
        <select class="input" id="pay"><option value="">اختار</option><option>كاش ويا المندوب</option><option>حوالة إلكترونية</option></select></div>
      <div class="err small" id="loginErr" role="alert"></div>
      <button class="btn y" id="loginBtn">دخول</button>
      <div class="links small" id="loginLinks"></div>
    </form>
  </div>
</div>

<div id="vApp" hidden>
  <div class="hero"><div class="inner">
    <h1 id="hello">أهلاً 👋</h1>
    <div class="tag" id="heroTag"></div>
    <div class="prog" id="prog"><i id="progBar"></i></div>
    <div class="meta" id="heroMeta" hidden></div>
  </div></div>
  <main><div class="inner">
    <button type="button" class="fbnote" id="fbNote" hidden></button>

    <!-- subscribers: today's lesson, the list of days, the mountain behind a button -->
    <div id="paidView" hidden>
      <div class="today card" id="today"></div>
      <section id="daysSec">
        <div class="sec-h"><h2>كل الأيام</h2></div>
        <div class="rows card" id="days"></div>
      </section>
      <section id="startSec" hidden>
        <div class="sec-h"><h2>🎬 فيديوهات البداية</h2></div>
        <div class="card start-vids" id="startVids"></div>
      </section>
      <button type="button" class="btn ghost wide" id="mtnToggle">🏔️ شوف رحلتك</button>
      <div id="mtnBox" class="stack" hidden><div class="sec-h"><h2>رحلتك</h2><span class="muted small" id="mtnMeta"></span></div><div class="chps" id="chPills" hidden></div><div id="mtn"></div></div>
    </div>

    <!-- free lesson: three steps, nothing else -->
    <div id="freeView" hidden>
      <div class="card pre-done" id="preDone" hidden></div>
      <ol class="fsteps">
        <li class="card fstep"><span class="fn">1</span><div class="fb-body"><h3>شوف المقدمة</h3><div class="intro-grid" id="fIntro"></div></div></li>
        <li class="card fstep"><span class="fn">2</span><div class="fb-body"><h3>المحاضرة الأولى وواجبها</h3>
          <p class="muted">فيديو المحاضرة، والملزمة وألعابها، وشرح واجب المحاكاة، وبالآخر تسجّل صوتك.</p>
          <button type="button" class="btn y" id="fLesson">افتح الدرس ←</button></div></li>
        <li class="card fstep" id="preStep"><span class="fn">3</span><div class="fb-body" id="preBox"></div></li>
      </ol>
      <details class="actd card">
        <summary id="actTitle">🔑 وصلك كود التفعيل؟</summary>
        <form class="stack" id="actBox">
          <div class="row"><input class="input en" id="actCode" placeholder="TA-XXXXX" autocapitalize="characters" style="flex:1;min-width:0"><button class="btn">فعّل</button></div>
          <div class="err small" id="actErr"></div>
        </form>
      </details>
    </div>
  </div></main>
</div>

<div class="lesson" id="lesson" hidden>
  <div class="lesson-bar"><button type="button" class="chip" id="lessonBack">→ رجوع</button><b id="lessonTitle"></b></div>
  <div class="lesson-body" id="lessonBody" hidden></div>
  <iframe id="lessonFrame" title="الدرس" allow="microphone;encrypted-media;fullscreen;picture-in-picture" allowfullscreen></iframe>
</div>

  setMode(mode);
  // Iraqi mobile: 07 then 5/7/8/9 then 8 digits (spaces, +964 and 00964 are fine)

    let d = (v || '').replace(/\D/g, '').replace(/^00/, '');

  // ---- "a new correction" banner ----

    const last = fresh[fresh.length - 1];
    n.innerHTML = `<span class="fb-ic">👨‍🏫</span><span><b>${fresh.length === 1 ? 'وصلك تصحيح جديد' : `وصلتك ${fresh.length} تصحيحات جديدة`}</b><br><span class="small">${last.s.note ? 'رد على ملاحظتك' : 'على واجب'} باليوم ${last.day.number}. اضغط حتى تشوفه</span></span><span class="go">←</span>`;
    n.hidden = false;
    n.onclick = () => {

  function countdown() {
    const el = $('nextOpen'); if (!el || !data.next_open) return;

    const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
    if (h >= 12) {
      const at = new Date(data.next_open), now = new Date();
      const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).toDateString() === at.toDateString();
      el.textContent = `⏱️ اليوم الجاي ينفتح ${tomorrow ? 'غداً' : 'اليوم'} الساعة ${data.send_hour % 12 || 12} العصر`;
      return;
    }
    el.textContent = `⏱️ اليوم الجاي ينفتح بعد ` + (h ? `${h} ساعة و` : '') + `${m} دقيقة`;
  }

  // ---- the mountain: one camp per lecture of the current chapter ----
  function renderMountain() {
    const d = data, today = d.days[d.days.length - 1], ch = today.chapter || 1;
    const lec = [...d.days, ...d.upcoming].filter(x => x.chapter === ch && (x.kind === 'lecture' || x.kind === 'capstone'));
    const seenNums = new Set(); const list = lec.filter(x => !seenNums.has(x.lecture) && seenNums.add(x.lecture));
    const curLecture = today.lecture;
    let doneCount = 0;
    const camps = list.map(x => {
      const open = x.number <= d.day && !(d.trial && x.number > 1);
      const its = d.days.filter(y => y.chapter === ch && y.lecture === x.lecture);
      const hws = its.filter(y => y.homework);
      const complete = open && its.length >= 3 && hws.every(y => y.homework.submissions.length);
      if (complete) doneCount++;
      const state = complete ? 'done' : x.lecture === curLecture ? 'cur' : open ? 'open' : 'locked';
      return { n: x.lecture, title: x.title, day: x.number, state, item: d.days.find(y => y.number === x.number) };
    });
    const chs = Object.keys(d.chapters).map(Number).filter(c => [...d.days, ...d.upcoming].some(x => x.chapter === c)).sort();
    $('mtnMeta').textContent = `${doneCount} من ${camps.length} محطات`;
    $('chPills').innerHTML = chs.map(c => {
      const st = c < ch ? 'done' : c === ch ? 'cur' : 'todo';
      return `<span class="chp ${st}">${st === 'done' ? '✓ ' : st === 'todo' ? '🔒 ' : ''}${esc(d.chapters[String(c)].ar)} · <span class="en">${esc(d.chapters[String(c)].name)}</span></span>`;
    }).join('');
    $('chPills').hidden = chs.length < 2;
    drawMountain($('mtn'), {
      chapter: ch, camps, onCamp: c => {
        if (c.state === 'locked') { toast(d.trial ? '🔒 هذا الدرس للمشتركين. اشترك حتى يفتحلك.' : `🔒 هذا الدرس ينفتح باليوم ${c.day}`); return; }
        openLesson(c.item, dayLabel(c.item));
      }
    });
  }

  function frame(u) {
    return `<div class="video"><iframe src="${esc(u)}" loading="lazy" allow="accelerometer;gyroscope;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="فيديو"></iframe></div>`;
  }

  // ---------- the lesson: full screen (video + workbook + homework), served by the API ----------
  let dirty = false;
  addEventListener('message', e => { if (e.data && e.data.lessonChanged) dirty = true; });
  function openLesson(day, L) {
    const ov = $('lesson');
    if (!day.lesson) {                                    // the intro day: its two videos, no lesson page
      $('lessonTitle').textContent = 'البداية';
      $('lessonFrame').hidden = true; $('lessonBody').hidden = false;
      $('lessonBody').innerHTML = `<div class="inner stack">${data.intro.map(u => `<b>1. المقدمة</b>${frame(u)}`).join('')}${data.howto.map(u => `<b>2. شلون تسوي واجب المحاكاة</b>${frame(u)}`).join('')}</div>`;
      ov.hidden = false; document.body.style.overflow = 'hidden'; history.pushState({ lesson: 1 }, '');
      return;
    }
    $('lessonFrame').hidden = false; $('lessonBody').hidden = true; $('lessonBody').innerHTML = '';
    const op = mem.get('opened', []); if (!op.includes(day.number)) { op.push(day.number); mem.set('opened', op); }
    mem.set('intro_seen', true); dirty = true;
    $('lessonTitle').textContent = `اليوم ${day.number} · ${L.t}`;
    $('lessonFrame').src = Learn.API + day.lesson + '?t=' + encodeURIComponent(token);
    ov.hidden = false; document.body.style.overflow = 'hidden';
    history.pushState({ lesson: day.number }, '');
  }
  function closeLesson(fromPop) {
    const ov = $('lesson'); if (ov.hidden) return;
    ov.hidden = true; document.body.style.overflow = ''; $('lessonFrame').src = 'about:blank'; $('lessonBody').innerHTML = '';
    if (!fromPop) history.back();
    if (dirty) { dirty = false; load(false); }
  }
  $('lessonBack').onclick = () => closeLesson(false);
  addEventListener('popstate', () => closeLesson(true));

  if (token && !RESET) load(true); else show('login');
})();
</script>
</body>
</html>
