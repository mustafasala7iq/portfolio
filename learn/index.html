<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">

<link rel="stylesheet" href="/learn/shared.css">
<style>
.hero{background:var(--yellow);color:var(--black)}
.hero .inner{padding-block:26px 30px}
.hero h1{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:900}
.hero .tag{font:600 1rem/1.5 var(--font-display);margin-top:4px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .meta .pill{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.12);color:var(--black)}
main .inner{padding-block:22px 60px}
section+section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:1.2rem;font-weight:800}

/* login */
.login{max-width:440px;margin:40px auto 0}
.login h1{font-size:1.6rem;font-weight:900}
.login .sub{margin:4px 0 18px}

/* day cards */
.day{overflow:hidden}
.day > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px}
.day > summary::-webkit-details-marker{display:none}
.dnum{flex:none;width:52px;height:52px;border-radius:14px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 1.15rem/1 var(--font-display)}
.dnum small{font:700 .62rem/1.2 var(--font-display);color:var(--muted)}
.day.today .dnum{background:var(--yellow);border-color:var(--yellow)}
.dtitle{flex:1;min-width:0}
.dtitle h3{font-size:1.02rem;font-weight:800}
.dtitle .k{font:700 .78rem/1.4 var(--font-display);color:var(--muted)}
.chev{flex:none;transition:transform .2s;color:var(--muted)}
.day[open] .chev{transform:rotate(180deg)}
.dbody{padding:0 18px 20px;display:flex;flex-direction:column;gap:16px}
.blk{border-top:1px dashed var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.blk h4{margin:0;font:800 .98rem/1.4 var(--font-display)}
.note{background:var(--yellow-wash);border:1px solid #F2DE92;border-radius:12px;padding:12px 14px}
.sub-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fb{background:var(--green-soft);border:1px solid #BFE6CF;border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.fb b{font-family:var(--font-display)}
.days{display:flex;flex-direction:column;gap:12px}
.lockd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px dashed var(--line-2);color:var(--muted)}
.lockd b{color:var(--ink-2);font-family:var(--font-display)}
.intro-grid{display:grid;gap:14px}
.day-open{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px}
.day-open:focus-visible{outline:3px solid var(--black);outline-offset:-3px;border-radius:18px}
.day .go{flex:none;font:800 .88rem/1 var(--font-display);color:var(--ink-2)}
.day.today{border-color:var(--yellow)}
.today{padding:20px;display:flex;flex-direction:column;gap:6px;border:2px solid var(--black);box-shadow:0 5px 0 var(--black)}
.t-k{font:900 .9rem/1.4 var(--font-display);color:var(--gold)}
.t-sub{font:700 .82rem/1.4 var(--font-display);color:var(--muted)}
.t-title{font-size:1.45rem;font-weight:900;text-align:right}
.steps{list-style:none;margin:10px 0 6px;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-weight:600}
.steps .ic{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font:900 .8rem/1 var(--font-display);background:#fff}
.steps li.ok{color:var(--muted)}
.steps li.ok .ic{background:var(--yellow);border-color:var(--black);color:var(--black)}
.steps li.wait .ic{border-color:var(--gold);background:var(--yellow-soft)}
.t-go{margin-top:6px;min-height:52px;font-size:1.05rem}
.t-next{text-align:center;margin-top:4px}
.fbnote{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:18px;border-radius:16px;background:var(--green-soft);border:2px solid var(--green);color:var(--ink)}
.fbnote .fb-ic{font-size:1.6rem}
.fbnote .go{margin-inline-start:auto;font-weight:900}
#mtn{max-width:330px;margin-inline:auto}
.chps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.chp{padding:4px 12px 6px;border-radius:999px;font:800 .8rem/1.4 var(--font-display);border:1.5px solid var(--line-2);background:#fff;color:var(--muted)}
.chp.cur{background:var(--yellow);border-color:var(--black);color:var(--black)}
.chp.done{background:var(--green-soft);border-color:#BFE6CF;color:var(--green)}
.hero{position:relative;overflow:hidden}
.hero .inner{position:relative;z-index:1}
.hero::before{content:"";position:absolute;width:300px;height:300px;inset-inline-end:-90px;top:-70px;border-radius:50%;border:44px solid rgba(255,255,255,.28)}
.links{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.links{align-items:center;text-align:center;margin-top:4px}
.links a{color:var(--ink);font-weight:700}
.links span{color:var(--muted)}
.sent-box{background:var(--yellow-wash);border:1px solid #F2DE92;border-radius:14px;padding:14px;color:var(--ink,#111);font-size:1rem;line-height:1.8}
.pre{margin-bottom:12px;background:var(--yellow-wash);border-color:#F2DE92}
.pre-ok{text-align:center;align-items:center;line-height:1.7}.pre-ok-ic{font-size:2.4rem;line-height:1}.pre-ok-t{font-family:var(--font-display);font-size:1.35rem}.pre-ok-go{font-weight:700}
.mtn-svg{direction:ltr;display:block;width:100%;height:auto;border-radius:22px;border:2px solid var(--black);box-shadow:0 5px 0 var(--black);font-family:var(--font-body);background:#fff}
.mtn-sky{fill:var(--yellow-wash)} .mtn-sun{fill:var(--yellow);opacity:.9} .mtn-far{fill:#D9D6CB}
.mtn-main{fill:var(--black)} .mtn-snow{fill:#fff} .mtn-shade{fill:#2b2b2b}
.mtn-trail{fill:none;stroke:#5a5a5a;stroke-width:5;stroke-dasharray:2 9;stroke-linecap:round}
.mtn-prog{fill:none;stroke:var(--yellow);stroke-width:6;stroke-linecap:round}
.mtn-flag line{stroke:#fff;stroke-width:3} .mtn-flag-cloth{fill:var(--yellow);stroke:var(--black);stroke-width:1.5}
.mtn-camp{cursor:pointer} .mtn-camp:focus{outline:none}
.mtn-dot{fill:#3a3a3a;stroke:#8a8a8a;stroke-width:3}
.mtn-num{font:900 15px var(--font-body);text-anchor:middle;fill:#cfcfcf;pointer-events:none}
.mtn-camp.todo .mtn-num{font-size:12px}
.mtn-camp.done .mtn-dot{fill:var(--yellow);stroke:var(--black)} .mtn-camp.done .mtn-num{fill:var(--black)}
.mtn-camp.open .mtn-dot{fill:#fff;stroke:#bdbab0} .mtn-camp.open .mtn-num{fill:var(--black)}
.mtn-camp.cur .mtn-dot{fill:#fff;stroke:var(--yellow);stroke-width:4} .mtn-camp.cur .mtn-num{fill:var(--black)}
.mtn-pulse{fill:none;stroke:var(--yellow);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:mtnpulse 1.8s ease-out infinite}
@keyframes mtnpulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
.mtn-camp:focus-visible .mtn-dot{stroke:#fff;stroke-width:4}
.mtn-chip{fill:#fff;stroke:var(--black);stroke-width:1.5}
.mtn-camp.todo .mtn-chip{fill:#ECEAE2;stroke:#9a978d} .mtn-camp.cur .mtn-chip{fill:var(--yellow)}
.mtn-lab-t{font:800 13px var(--font-display);fill:#141414}
.mtn-lab.r .mtn-lab-t{text-anchor:start} .mtn-lab.l .mtn-lab-t{text-anchor:end} .mtn-lab.top .mtn-lab-t{text-anchor:middle}
.mtn-camp.todo .mtn-lab-t{fill:#6d6a62}
.mtn-climber{pointer-events:none} .mtn-climber-b{fill:#fff;stroke:var(--black);stroke-width:2.5} .mtn-climber-e{font-size:17px;text-anchor:middle}
/* clean dashboard */
.prog{position:relative;height:8px;border-radius:99px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:14px;max-width:420px}
.prog i{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--black);border-radius:99px;transition:width .6s}
#paidView,#freeView{display:flex;flex-direction:column;gap:22px}
#paidView[hidden],#freeView[hidden]{display:none}
.today .t-title{margin-top:2px}
.t-hint{text-align:center;color:var(--muted);font-weight:600;margin-top:2px}
.t-daily{text-align:center;font-weight:700;font-size:.92rem;color:var(--ink-2)}
.t-miss{text-align:center;font-weight:700;color:var(--red);font-size:.92rem}
.t-v{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.t-v b{font-family:var(--font-display)}
.rows{padding:0;overflow:hidden}
.drow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow:focus-visible{outline:3px solid var(--black);outline-offset:-3px}
.dn{flex:none;width:34px;height:34px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font:900 .95rem/1 var(--font-display)}
.dt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt b{font:700 .97rem/1.4 var(--font-display)}
.dt b.en{direction:ltr;unicode-bidi:isolate}
.st{flex:none;font:800 .78rem/1 var(--font-display);padding:5px 9px 7px;border-radius:99px}
.st.todo{background:var(--line);color:var(--ink-2)}
.st.ok{background:var(--green-soft);color:var(--green)} .st.wait{background:var(--yellow-soft);color:var(--gold)} .st.bad{background:var(--red-soft);color:var(--red)}
.chev{flex:none;color:var(--muted);font-size:1.3rem;line-height:1}
.row-more{all:unset;box-sizing:border-box;cursor:pointer;width:100%;text-align:center;padding:13px;min-height:48px;font:800 .9rem/1 var(--font-display);color:var(--ink-2)}
.wide{width:100%}
.start-vids{padding:16px;display:grid;gap:16px}
@media (min-width:640px){.start-vids{grid-template-columns:1fr 1fr}}
.start-vids .t-v{margin:0}
.fsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.fstep{display:flex;gap:14px;padding:18px;align-items:flex-start}
.fn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--black);color:var(--yellow);display:grid;place-items:center;font:900 1rem/1 var(--font-display)}
.fb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.fb-body h3{font-size:1.15rem;font-weight:900}
.fb-body p{margin:0}
.fstep .pre{margin:0;background:none;border:0;box-shadow:none;padding:0}
.pre-done{padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--yellow-wash);border-color:#F2DE92;line-height:1.8}
.pre-done p{margin:0}
.pre-done .pre-ok-t{font:900 1.2rem/1.4 var(--font-display)}
.pre-done .pre-ok-go{font-weight:700}
.actd{padding:14px 18px}
.actd summary{cursor:pointer;font:800 .95rem/1.4 var(--font-display);list-style:none}
.actd summary::-webkit-details-marker{display:none}
.actd form{margin-top:10px}
.lesson-body{flex:1;overflow:auto;padding-block:18px 40px}
.lesson-body .stack{gap:10px}
.lesson-body b{font-family:var(--font-display)}
/* single page v3 */
.hero .inner{padding-block:20px 22px}
.hero h1{font-size:clamp(1.35rem,5vw,1.8rem)}
.jr{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.jr-bar{display:flex;gap:4px;height:12px}
.jr-seg{position:relative;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden}
.jr-seg i{position:absolute;top:0;bottom:0;right:0;background:var(--black);border-radius:99px}
.jr-seg.cur{outline:2px solid var(--black);outline-offset:1px}
.jr-lab{display:flex;gap:4px;font:700 .85rem/1.3 var(--font-display)}
.jr-lab span{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-lab span.cur{font-weight:900}
.jr-go{all:unset;box-sizing:border-box;cursor:pointer;align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;font:800 1rem/1 var(--font-display);text-decoration:underline;text-underline-offset:5px}
.mtn-card{padding:16px;margin-bottom:18px}
#paidView{display:flex;flex-direction:column;gap:14px}
#paidView[hidden]{display:none}
.paybox{gap:10px;margin-top:4px}
.pay-price{display:flex;align-items:baseline;gap:6px;font-family:var(--font-display)}
.pay-price b{font-size:1.7rem;font-weight:900}
.paybox .btn{width:100%}
.pay-alt{margin-top:10px}
.pay-alt summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
.intro-top{padding:16px;display:flex;flex-direction:column;gap:10px}
.acc{padding:18px 16px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--yellow)}
.acc h2{font:800 1.15rem/1.4 var(--font-display);margin:0}
.acc p{margin:0;color:var(--muted);line-height:1.7}
.acc-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc-opt{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--line-2);border-radius:14px;background:#fff}
.acc-opt b{font:800 1.05rem/1.3 var(--font-display)}
.acc-opt .btn{width:100%;min-height:46px;padding:0 10px}
.acc-play{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:var(--yellow-wash);font-weight:700;font-size:.92rem}
.acc-play[aria-pressed=true]{background:var(--yellow)}
@media (max-width:340px){.acc-opts{grid-template-columns:1fr}}
.intro-top h2{font-size:1.1rem;font-weight:900}
/* today: compact */
.today2{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--black);box-shadow:0 4px 0 var(--black)}
.t2-top{display:flex;align-items:center;gap:12px}
.t2-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.t2-k{font:800 .9rem/1.4 var(--font-display);color:var(--gold)}
.t2-t{font:900 1.15rem/1.35 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2-t.en{direction:ltr;text-align:right;unicode-bidi:isolate}
.t2-go{flex:none;min-height:48px;padding:0 18px 2px}
.t2-tasks{display:flex;flex-wrap:wrap;gap:8px}
.tk{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font:700 .95rem/1.3 var(--font-display);color:var(--ink-2)}
.tk.ok{background:var(--green-soft);border-color:#BFE6CF;color:var(--green)}
.tk svg{flex:none;width:18px;height:18px}
.t2-next{color:var(--muted);font-size:1rem}
.resume{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px dashed var(--line-2);font:700 1rem/1.4 var(--font-display);color:var(--ink)}
.resume svg{flex:none;width:20px;height:20px}
.resume .rs-t{flex:1;min-width:0;display:flex;flex-direction:column}
.resume .rs-t > span{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miss-line{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:44px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--yellow-wash);color:var(--ink-2);font:600 1rem/1.5 var(--font-body)}
.miss-line .go{margin-inline-start:auto;font-weight:800}
.logout-link{all:unset;box-sizing:border-box;cursor:pointer;display:block;margin:36px auto 0;min-height:44px;padding:10px 16px;color:var(--muted);font:600 1rem/1.5 var(--font-body);text-decoration:underline;text-underline-offset:4px}
/* the two lists */
.lsec{margin-top:10px}
.lsec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.lsec-h h2{font-size:1.25rem;font-weight:900}
.lsec-h .muted{font-size:.95rem}
#secHw .lsec-h h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold);margin-inline-end:8px;vertical-align:middle}
#secLec .lsec-h h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--black);margin-inline-end:8px;vertical-align:middle}
.chg{border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.chg > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px}
.chg > summary::-webkit-details-marker{display:none}
.chg > summary:focus-visible{outline:3px solid var(--black);outline-offset:-3px}
.cg-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cg-t b{font:900 1.02rem/1.35 var(--font-display)}
.cg-p{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.cg-bar{flex:1;max-width:160px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cg-bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.cg-p svg{flex:none;width:16px;height:16px}
.cg-ch{flex:none;width:22px;height:22px;color:var(--muted);transition:transform .2s}
.chg[open] .cg-ch{transform:rotate(180deg)}
.chg.locked > summary{color:var(--muted)}
.lrows{border-top:1px solid var(--line)}
.lrow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:focus-visible{outline:3px solid var(--black);outline-offset:-3px}
.lrow .ln{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line-2);font:900 .98rem/1 var(--font-display)}

#secHw .lrow .ln{border-radius:10px}
.lrow .ln svg{width:18px;height:18px}

.lrow .lt b{font:800 1rem/1.4 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lt b.en{direction:ltr;text-align:right;unicode-bidi:isolate}
.lrow .lsub{display:flex;gap:8px;align-items:baseline;white-space:nowrap;overflow:hidden;min-width:0;font-size:.95rem;color:var(--muted)}

.lrow .score{flex:none;font:800 .9rem/1 var(--font-display);padding:6px 9px;border-radius:99px;background:var(--yellow-soft);color:var(--gold)}
.lrow .score.ok{background:var(--green-soft);color:var(--green)}
.lrow .lgo{flex:none;width:18px;height:18px;color:var(--muted)}
.lrow.done .ln{background:var(--green-soft);border-color:#BFE6CF;color:var(--green)}

.lrow .lbar{position:absolute;inset:auto 66px 6px 16px;height:3px;border-radius:3px;background:var(--line)}
.lrow .lbar i{display:block;height:100%;border-radius:3px;background:var(--black)}
.st.todo{background:var(--line);color:var(--ink-2)}
.row-more{min-height:48px}

<body>
<header class="bar"><div class="inner">
  <div class="lock" id="lock"></div>
  <div class="sp"></div>
  <span class="chip" id="dayChip" hidden>اليوم <b id="dayNum">1</b>/<span id="dayTot">30</span></span>
</div></header>

<div id="vLogin">
  <div class="inner">
    <form class="login card pad stack" id="loginForm" novalidate>
      <div>
        <h1 id="loginTitle">كورس مصطفى صلاح</h1>
        <p class="sub muted" id="loginSub">ما راح تحفظ، راح تحجي.</p>
      </div>
      <div class="field" data-m="act free"><label for="name">اسمك</label>
        <input class="input" id="name" autocomplete="name" placeholder="مثلاً: علي حسن"></div>
      <div class="field" data-m="act free"><label for="phone">رقم الموبايل</label>
        <input class="input en" id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="07xx xxx xxxx" maxlength="16"></div>
      <div class="field" data-m="login act free forgot"><label for="email" id="emailLabel">الإيميل</label>
        <input class="input en" id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="name@gmail.com"></div>
      <div class="field" data-m="login act free reset"><label for="pw">الباسورد</label>
        <input class="input en" id="pw" type="password" autocomplete="current-password" placeholder="6 أحرف أو أكثر"></div>
      <div class="field" data-m="act free reset"><label for="pw2">أكد الباسورد</label>
        <input class="input en" id="pw2" type="password" autocomplete="new-password" placeholder="اكتبه مرة ثانية"></div>
      <div class="field" data-m="act"><label for="code">كود التفعيل</label>
        <input class="input en" id="code" autocapitalize="characters" autocomplete="one-time-code" placeholder="TA-XXXXX"></div>
      <div class="field" data-m="free"><label for="goal">ليش تتعلم إنكليزي؟</label>
        <select class="input" id="goal"><option value="">اختار</option><option>للشغل</option><option>للدراسة</option><option>للسفر</option><option>أريد أحچي بثقة</option><option>غيرها</option></select></div>
      <div class="field" data-m="free"><label for="city">المحافظة</label>
        <select class="input" id="city"><option value="">اختار محافظتك</option><option>البصرة</option><option>بغداد</option><option>أربيل</option><option>الأنبار</option><option>بابل</option><option>حلبجة</option><option>دهوك</option><option>ديالى</option><option>ذي قار</option><option>السليمانية</option><option>صلاح الدين</option><option>القادسية</option><option>كربلاء</option><option>كركوك</option><option>المثنى</option><option>ميسان</option><option>النجف</option><option>نينوى</option><option>واسط</option><option>خارج العراق</option></select></div>
      <div class="field" data-m="pre"><label for="pay">شلون تحب تدفع؟</label>
        <select class="input" id="pay"><option value="">اختار</option><option>كاش ويا المندوب</option><option>حوالة إلكترونية</option></select></div>
      <div class="err small" id="loginErr" role="alert"></div>
      <button class="btn y" id="loginBtn">دخول</button>
      <div class="links small" id="loginLinks"></div>
    </form>
  </div>
</div>

<div id="vApp" hidden>
  <div class="hero" id="hero"><div class="inner">
    <h1 id="hello">أهلاً</h1>
    <div class="tag" id="heroTag"></div>
    <div class="jr" id="journey" hidden></div>
    <div class="meta" id="heroMeta" hidden></div>
  </div></div>
  <main><div class="inner">
    <div id="mtnBox" class="card mtn-card" hidden><div class="sec-h"><h2>رحلتك</h2><span class="muted small" id="mtnMeta"></span></div><div class="chps" id="chPills" hidden></div><div id="mtn"></div></div>
    <button type="button" class="fbnote" id="fbNote" hidden></button>
    <div class="card acc" id="accentBox" hidden></div>

    <div id="paidView" hidden>
      <div class="card intro-top" id="introTop" hidden></div>
      <div class="today2 card" id="today"></div>
      <button type="button" class="resume" id="resume" hidden></button>
      <button type="button" class="miss-line" id="missLine" hidden></button>

      <section class="lsec" id="secLec">
        <div class="lsec-h"><h2>المحاضرات</h2><span class="muted" id="lecSum"></span></div>
        <div id="lecList"></div>
      </section>
      <section class="lsec" id="secHw">
        <div class="lsec-h"><h2>الواجبات</h2><span class="muted" id="hwSum"></span></div>
        <div id="hwList"></div>
      </section>
    </div>

    <!-- free lesson: three steps, nothing else -->
    <div id="freeView" hidden>
      <div class="card pre-done" id="preDone" hidden></div>
      <ol class="fsteps">
        <li class="card fstep"><span class="fn">1</span><div class="fb-body"><h3>شوف المقدمة</h3><div class="intro-grid" id="fIntro"></div></div></li>
        <li class="card fstep"><span class="fn">2</span><div class="fb-body"><h3>المحاضرة الأولى وواجبها</h3>
          <p class="muted">فيديو المحاضرة، والملزمة، والكويز ولعبة الدرس، وشرح واجب المحاكاة، وبالآخر تسجّل صوتك.</p>
          <button type="button" class="btn y" id="fLesson">افتح الدرس ←</button></div></li>
        <li class="card fstep" id="preStep"><span class="fn">3</span><div class="fb-body" id="preBox"></div></li>
      </ol>
      <details class="actd card">
        <summary id="actTitle">وصلك كود التفعيل؟</summary>
        <form class="stack" id="actBox">
          <div class="row"><input class="input en" id="actCode" placeholder="TA-XXXXX" autocapitalize="characters" style="flex:1;min-width:0"><button class="btn">فعّل</button></div>
          <div class="err small" id="actErr"></div>
        </form>
      </details>
    </div>
    <button type="button" class="logout-link" id="accentLink" hidden style="margin-top:28px"></button>
    <button type="button" class="logout-link" id="logout" style="margin-top:4px">تسجيل الخروج</button>
  </div></main>
</div>

<div class="lesson" id="lesson" hidden>
  <div class="lesson-bar"><button type="button" class="chip" id="lessonBack">→ رجوع</button><b id="lessonTitle"></b></div>
  <div class="lesson-body" id="lessonBody" hidden></div>
  <iframe id="lessonFrame" title="الدرس" allow="microphone;encrypted-media;fullscreen;picture-in-picture" allowfullscreen></iframe>
</div>

<script src="/learn/config.js"></script>
<script src="/learn/brand.js"></script>
<script src="/learn/common.js"></script>

<script>
(function () {
  const { call, esc, store, fileUrl, toast, when, recorder } = Learn;
  const $ = id => document.getElementById(id);
  $('lock').innerHTML = `<img class="sig" src="${BRAND.sig}" alt="Mustafa Salah"><span class="x">×</span><img src="${BRAND.logo}" alt="Ta3alm English">`;
  let token = store.get('learn_token');
  let data = null;

  function show(v) { $('vLogin').hidden = v !== 'login'; $('vApp').hidden = v !== 'app'; $('dayChip').hidden = v !== 'app'; if (v !== 'app') document.body.classList.remove('has-nav'); }
  // small line icons (no emoji in the lists)
  const IC = {
    check: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    lock: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 9V6.5a3 3 0 016 0V9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
    ring: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
    back: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5L3 9l4 4M3.5 9H12a5 5 0 010 10h-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="scale(-1,1) translate(-20,0)"/></svg>',
    chev: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    go: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  $('missLine').onclick = () => {                     // open the chapter with the first homework left behind
    const t = data.tasks.find(x => x.open && !x.done && x.day < data.day);
    const g = t && document.querySelector(`#hwList .chg[data-ch="${t.chapter}"]`);
    if (g) { g.open = true; g.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  };

  // ---------- login / sign up ----------
  const params = new URLSearchParams(location.search);
  const SOURCE = params.get('src') || params.get('utm_source') || (document.referrer ? new URL(document.referrer).hostname : '') || 'direct';
  const WA = window.SUPPORT_WA ? 'https://wa.me/' + window.SUPPORT_WA : null;
  // new visitors sign up first; a device that already had an account opens on "log in"
  const PRE = params.has('preorder');
  // Meta Pixel events. Purchase carries the course price (39,000 IQD until launch, then 49,000).
  function px(ev) {
    try {
      if (!window.fbq) return;
      if (ev === 'Purchase') fbq('track', 'Purchase', { value: Date.now() < Date.UTC(2026, 11, 13, 14) ? 39000 : 49000, currency: 'IQD' });
      else fbq('track', ev);
    } catch (e) { /* never block the page */ }
  }
  const RESET = params.get('reset');
  let mode = RESET ? 'reset' : params.has('free') ? 'free' : (params.has('login') || store.get('has_account') ? 'login' : 'act');
  const MODES = {
    login: { t: 'سجّل دخول', s: 'أهلاً بيك مرة ثانية 👋 ادخل بإيميلك أو رقم موبايلك، والباسورد.', b: 'دخول',
      l: `<a href="#" data-go="act">ما عندك حساب؟ سوّي حساب</a><a href="#" data-go="forgot">نسيت الباسورد؟</a>` },
    forgot: { t: 'نسيت الباسورد؟', s: 'اكتب إيميلك أو رقم موبايلك اللي سجلت بيه، ونرسلك رابط على إيميل حسابك تحط بيه باسورد جديد.', b: 'أرسل الرابط',
      l: `<a href="#" data-go="login">رجوع لتسجيل الدخول</a>${WA ? `<a href="${WA}" target="_blank" rel="noopener">ما وصلك شي؟ راسلنا على واتساب</a>` : ''}` },
    reset: { t: 'باسورد جديد 🔑', s: 'اكتب باسورد جديد لحسابك، وبعدها تدخل مباشرة.', b: 'احفظ وادخل',
      l: `<a href="#" data-go="forgot">الرابط ما يشتغل؟ اطلب رابط جديد</a>` },
    act: { t: 'سوّي حسابك', s: 'اكتب معلوماتك وكود التفعيل اللي وصلك. بعدها تدخل بإيميلك والباسورد من موبايلك ولابتوبك.', b: 'سوّي الحساب وابدي الكورس',
      l: `<span>عندك حساب؟ <a href="#" data-go="login">سجّل دخول</a></span><span>ما عندك كود؟ <a href="/learn/free">جرّب الدرس الأول مجاناً</a></span>` },
    free: { t: 'درسك الأول مجاناً 🎁', s: 'سوّي حسابك، وشوف المقدمة والمحاضرة الأولى، وجرّب واجب المحاكاة.', b: 'ابدي الدرس المجاني',
      l: `<span>عندك حساب؟ <a href="#" data-go="login">سجّل دخول</a></span>` },
  };
  function setMode(m) {
    mode = m; const M = MODES[m]; $('loginBtn').hidden = false;
    $('loginTitle').textContent = M.t; $('loginSub').textContent = M.s; $('loginBtn').textContent = M.b;
    const either = m === 'login' || m === 'forgot';             // these two take the email or the mobile number
    $('emailLabel').textContent = either ? 'الإيميل أو رقم الموبايل' : 'الإيميل';
    $('email').type = either ? 'text' : 'email';
    $('email').inputMode = either ? 'text' : 'email';
    $('email').placeholder = either ? 'name@gmail.com أو 07xx xxx xxxx' : 'name@gmail.com';
    $('loginLinks').innerHTML = M.l; $('loginErr').textContent = '';
    document.querySelectorAll('#loginForm [data-m]').forEach(f => {
      const ms = f.dataset.m.split(' ');
      f.hidden = !(ms.includes(m) || (PRE && m === 'free' && ms.includes('pre')));
    });
    if (PRE && m === 'free') {
      $('loginTitle').textContent = 'احجز مقعدك بسعر الإطلاق 🎟️';
      $('loginSub').textContent = 'سجّل حجزك هسة بدون دفع، ونتواصل وياك بأسرع وقت حتى نثبّت حجزك. وبنفس الوقت شوف الدرس الأول مجاناً.';
      $('loginBtn').textContent = 'احجز مقعدي';
    }
    $('pw').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    $('pw').placeholder = m === 'reset' ? 'الباسورد الجديد: 6 أحرف أو أكثر' : '6 أحرف أو أكثر';
    $('pw2').value = '';
    $('loginLinks').querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); setMode(a.dataset.go); });
  }
  setMode(mode);
  // Iraqi mobile: 07 then 5/7/8/9 then 8 digits (spaces, +964 and 00964 are fine)
  function iraqiMobile(v) {
    let d = (v || '').replace(/\D/g, '').replace(/^00/, '');
    if (d.startsWith('964')) d = '0' + d.slice(3);
    if (d.length === 10 && d.startsWith('7')) d = '0' + d;
    return /^07[5789]\d{8}$/.test(d) ? d : null;
  }
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('loginErr'), v = id => $(id).value.trim();
    err.textContent = '';
    const fail = (msg, id) => { err.textContent = msg; if (id) $(id).focus(); };
    if (mode === 'forgot' || mode === 'reset') return forgotOrReset(err, v, fail);
    if (mode !== 'login') {
      if (!v('name')) return fail('اكتب اسمك.', 'name');
      if (!iraqiMobile(v('phone'))) return fail('اكتب رقم موبايلك العراقي الصحيح: 11 رقم يبدي بـ 07، مثل 0770 123 4567', 'phone');
    }
    const emailOk = /^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(v('email'));
    if (mode === 'login' ? !(emailOk || iraqiMobile(v('email'))) : !emailOk)
      return fail(mode === 'login' ? 'اكتب إيميلك أو رقم موبايلك اللي سجلت بيه.' : 'اكتب إيميلك صح، مثل name@gmail.com', 'email');
    if ($('pw').value.length < 6) return fail(mode === 'login' ? 'اكتب الباسورد.' : 'الباسورد لازم يكون 6 أحرف أو أكثر.', 'pw');
    if (mode !== 'login' && $('pw2').value !== $('pw').value) return fail('الباسوردين مو نفس الشي. اكتبهن مرة ثانية.', 'pw2');
    if (mode === 'act' && !v('code')) return fail('اكتب كود التفعيل.', 'code');
    if (mode === 'free' && !v('city')) return fail('اختار محافظتك.', 'city');
    if (mode === 'free' && PRE && !v('pay')) return fail('اختار شلون تحب تدفع.', 'pay');
    const btn = $('loginBtn'); btn.disabled = true;
    try {
      const body = { email: v('email'), password: $('pw').value };
      const r = mode === 'login' ? await call('/api/login', { method: 'POST', json: body })
        : await call('/api/register', { method: 'POST', json: { ...body, name: v('name'), phone: v('phone'), free: mode === 'free',
            code: v('code'), goal: v('goal'), city: v('city'), source: SOURCE, preorder: PRE && mode === 'free', pay: v('pay') } });
      token = r.token; store.set('learn_token', token); store.set('has_account', '1');
      if (mode !== 'login') px(PRE && mode === 'free' ? 'Lead' : mode === 'act' ? 'Purchase' : 'CompleteRegistration');
      await load(true);
    } catch (x) { err.textContent = x.message; }
    finally { btn.disabled = false; }
  };
  async function forgotOrReset(err, v, fail) {
    const btn = $('loginBtn'); btn.disabled = true;
    try {
      if (mode === 'forgot') {
        if (!(/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(v('email')) || iraqiMobile(v('email'))))
          return fail('اكتب إيميلك أو رقم موبايلك اللي سجلت بيه.', 'email');
        let r;
        try { r = await call('/api/forgot', { method: 'POST', json: { email: v('email') } }); }
        catch (x) {
          if (x.status !== 503) throw x;
          err.innerHTML = WA ? `راسلنا على <a href="${WA}" target="_blank" rel="noopener">واتساب</a> حتى نطلعلك باسورد جديد.` : x.message;
          return;
        }
        $('loginTitle').textContent = '📩 شوف إيميلك';
        $('loginSub').textContent = '';
        document.querySelectorAll('#loginForm [data-m]').forEach(f => f.hidden = true);
        btn.hidden = true;
        if (r.no_email) {
          $('loginTitle').textContent = 'نسيت الباسورد؟';
          err.innerHTML = `<div class="sent-box">حسابك ما بيه إيميل، فما نكدر نرسلك رابط. ${WA ? `راسلنا على <a href="${WA}" target="_blank" rel="noopener">واتساب</a>` : 'راسلنا على واتساب'} ونطلعلك باسورد جديد.</div>`;
          return;
        }
        const where = r.to ? `على إيميل حسابك <b class="en" dir="ltr">${esc(r.to)}</b>` : `إذا <b class="en" dir="ltr">${esc(v('email'))}</b> عنده حساب`;
        err.innerHTML = `<div class="sent-box">دزّينا رابط تغيير الباسورد ${where}.<br>
          افتح البريد، وإذا ما لكيته شوف الـ <b>Spam</b>. الرابط يشتغل 30 دقيقة.</div>`;
        return;
      }
      if ($('pw').value.length < 6) return fail('الباسورد لازم يكون 6 أحرف أو أكثر.', 'pw');
      if ($('pw2').value !== $('pw').value) return fail('الباسوردين مو نفس الشي. اكتبهن مرة ثانية.', 'pw2');
      const r = await call('/api/reset', { method: 'POST', json: { token: RESET, password: $('pw').value } });
      history.replaceState(null, '', location.pathname);
      token = r.token; store.set('learn_token', token); store.set('has_account', '1');
      toast('✅ تغيّر الباسورد');
      await load(true);
    } catch (x) { err.textContent = x.message; }
    finally { btn.disabled = false; }
  }
  $('logout').onclick = async () => {
    try { await call('/api/logout', { method: 'POST', token }); } catch (e) {}
    store.set('learn_token', null); token = null; setMode('login'); show('login');
  };

  // ---------- data ----------
  async function load(first) {
    try { data = await call('/api/me', { token }); }
    catch (x) {
      if (x.status === 401) { store.set('learn_token', null); token = null; show('login'); return; }
      toast(x.message); return;
    }
    render(first);
  }

  const chap = n => (data.chapters[String(n)] || {});
  // every homework of a day: its own (imitation / review / challenge) + the Daily English clip
  const hwsOf = day => [day.homework, day.daily].filter(Boolean);
  const doneCount = day => hwsOf(day).filter(h => h.submissions.length).length;
  const dailyLine = day => day.daily ? `<div class="t-daily">🎧 + الواجب الثاني: <span class="en" dir="ltr">${esc(day.daily.title)}</span></div>` : '';

  function dayLabel(d) {
    if (d.kind === 'intro') return { k: 'اليوم الأول', t: 'البداية: المقدمة وشرح واجب المحاكاة', en: false };
    if (d.kind === 'lecture') return { k: `${chap(d.chapter).ar || ''} · المحاضرة ${d.lecture} + واجب المحاكاة A`, t: d.title, en: true };
    if (d.kind === 'homework') return { k: `المحاضرة ${d.lecture} · ${d.title}`, t: `واجب المحاكاة ${d.homework ? d.homework.key.slice(-1) : 'B'}`, en: false };
    if (d.kind === 'review' && d.final) return { k: 'المراجعة النهائية', t: `مراجعة نهائية ${d.final}`, en: false };
    if (d.kind === 'review') return { k: `${chap(d.chapter).ar || ''} · مراجعة الفصل`, t: `مراجعة الفصل ${d.review || ''}`, en: false };

    const circle = state === 'done' ? IC.check : state === 'locked' ? IC.lock : num;
    b.innerHTML = `<span class="ln" aria-hidden="true">${circle}</span>
      <span class="lt"><b class="${en ? 'en' : ''}">${esc(title)}</b><span class="lsub"><span>${esc(sub)}</span>${sub2 ? `<span class="e">${esc(sub2)}</span>` : ''}</span></span>
      ${score ? `<span class="score ${score.ok ? 'ok' : ''}">${esc(score.t)}</span>` : ''}
      ${state === 'locked' ? '' : `<span class="lgo">${IC.go}</span>`}
      ${bar ? `<span class="lbar" aria-hidden="true"><i style="width:${bar}%"></i></span>` : ''}`;
    if (state === 'locked') b.setAttribute('aria-disabled', 'true'); else b.onclick = onOpen;
    return b;
  }
  const scoreOf = t => {
    if (!t || (t.game == null && !t.quiz)) return null;
    const q = t.quiz;
    return { t: q ? `الكويز ${q.best}/${q.total}` : `اللعبة ${t.game}/3`, ok: t.done };
  };
  function renderLists() {
    const d = data, todayN = d.day;
    const lecRow = l => {
      const state = !l.open ? 'locked' : l.day === todayN && !l.intro ? 'today' : l.done ? 'done' : 'open';
      const sub = state === 'locked' ? opensText(l.opens_on) : state === 'today' ? 'محاضرة اليوم' : state === 'done' ? 'شفتها' : l.pos > 5 ? 'بعدك بنصها' : (l.ar || '');
      const bar = !l.done && l.pos > 5 && l.dur ? Math.min(98, Math.round(100 * l.pos / l.dur)) : 0;
      return lrow({ state, num: l.lecture, en: !l.intro, sub, sub2: state === 'locked' || state === 'open' && !l.pos ? '' : l.ar, bar, score: scoreOf(l.test),
        title: l.intro ? 'المقدمة' : `${l.lecture}. ${l.title}`,
        onOpen: () => l.intro ? openIntro() : openLesson({ number: l.day, lesson: l.lesson }, { t: l.title }) });
    };
    const lec = d.lectures, ld = lec.filter(l => l.done).length;
    $('lecSum').textContent = `شفت ${ld} من ${lec.length}`;
    $('lecList').replaceChildren(...chapterGroups(lec, lecRow));
    const tRow = t => {
      const state = !t.open ? 'locked' : t.done ? 'done' : t.day === todayN ? 'today' : 'open';
      const sub = state === 'locked' ? opensText(t.opens_on) : state === 'done' ? 'خلصته' : state === 'today' ? 'واجب اليوم' : 'ما خلصته';
      return lrow({ state, num: t.day, title: t.title, sub, sub2: t.sub, score: t.quiz ? scoreOf(t.test) : null,
        onOpen: () => openLesson({ number: t.day, lesson: t.lesson }, { t: t.title }, t.daily ? '#lp-daily' : t.quiz ? '#lp-test' : '#lp-hw') });
    };
    const opened = d.tasks.filter(t => t.open), td = opened.filter(t => t.done).length;
    $('hwSum').textContent = `خلصت ${td} من ${opened.length} انفتحت`;
    $('hwList').replaceChildren(...chapterGroups(d.tasks, tRow));
  }
  function openIntro() {
    const ov = $('lesson');
    $('lessonTitle').textContent = 'المقدمة';
    $('lessonFrame').hidden = true; $('lessonBody').hidden = false;
    $('lessonBody').innerHTML = `<div class="inner stack">${data.intro.map(frame).join('') || '<div class="muted">⏳ الفيديو راح ينزل قريباً.</div>'}</div>`;
    watch($('lessonBody'), 'INTRO');
    ov.hidden = false; document.body.style.overflow = 'hidden'; document.body.classList.add('in-lesson'); history.pushState({ lesson: 0 }, '');
    dirty = true;
  }
  // rewind / speed / resume for the videos on this page (the intro)
  function watch(box, key) {
    const l = (data.lectures || []).find(x => x.key === key) || {};
    box.querySelectorAll('.video iframe').forEach(f => Learn.video(f, { key, token, pos: l.pos || 0, done: l.done, onEnded: () => { dirty = true; } }));
  }

  function frame(u) {
    return `<div class="video"><iframe src="${esc(u)}" loading="lazy" allow="accelerometer;gyroscope;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="فيديو"></iframe></div>`;
  }

  // ---------- the lesson: full screen (video + workbook + homework), served by the API ----------
  let dirty = false;
  addEventListener('message', e => { if (e.data && e.data.lessonChanged) dirty = true; });
  function openLesson(day, L, hash) {
    const ov = $('lesson');
    if (!day.lesson) return openIntro();
    document.body.classList.add('in-lesson');
    $('lessonFrame').hidden = false; $('lessonBody').hidden = true; $('lessonBody').innerHTML = '';
    const op = mem.get('opened', []); if (!op.includes(day.number)) { op.push(day.number); mem.set('opened', op); }
    mem.set('intro_seen', true); dirty = true;
    $('lessonTitle').textContent = `اليوم ${day.number} · ${L.t}`;
    $('lessonFrame').src = Learn.API + day.lesson + '?t=' + encodeURIComponent(token) + (hash || '');
    ov.hidden = false; document.body.style.overflow = 'hidden';
    history.pushState({ lesson: day.number }, '');
  }
  function closeLesson(fromPop) {
    const ov = $('lesson'); if (ov.hidden) return;
    ov.hidden = true; document.body.style.overflow = ''; document.body.classList.remove('in-lesson'); $('lessonFrame').src = 'about:blank'; $('lessonBody').innerHTML = '';
    if (!fromPop) history.back();
    if (dirty) { dirty = false; load(false); }
  }
  $('lessonBack').onclick = () => closeLesson(false);
  addEventListener('popstate', () => closeLesson(true));

  if (token && !RESET) load(true); else show('login');
})();
</script>
</body>
</html>
